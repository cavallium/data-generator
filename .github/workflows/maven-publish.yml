# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # weekly

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: "linux/amd64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Select exact build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            REVISION="${GITHUB_REF_NAME#v}"
          else
            REVISION="1.1.${{ github.run_number }}-SNAPSHOT"
          fi
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          server-id: mchv-release-distribution
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
        env:
          MAVEN_USERNAME: ${{ secrets.MCHV_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MCHV_TOKEN }}
      - name: Verify
        run: mvn -B -Drevision="${REVISION}" clean verify
      - name: Deploy tagged release
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          test "v${REVISION}" = "$GITHUB_REF_NAME"
          mvn -B -Drevision="${REVISION}" -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MCHV_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MCHV_TOKEN }}
