# versions must have only numbers, lowercase letters, dots, dashes. Maximum: 99.999.9999
versions:
  0.0.0:
    details:
      changelog: "First version"
  0.0.1:
    previousVersion: 0.0.0
    details:
      changelog: "senderUserId is now chatId in messages, added isPinned (and upgraded to 1.6.10)"
    transformations:
      - moveData:
          transformClass: Message
          from: senderUserId
          to: senderId
      - upgradeData:
          transformClass: Message
          from: senderId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.Message.SenderId"
          type: ChatEntityId
      - newData:
          transformClass: Message
          to: isPinned
          initializer: "org.yotsuba.database.initializers.V169Initializers.Message.IsPinned"
          type: boolean
          index: 16
  0.0.2:
    previousVersion: 0.0.1
    details:
      changelog: "file id to global id"
    transformations:
      - upgradeData:
          transformClass: Audio
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: Animation
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: PhotoSize
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: Document
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: Sticker
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: Video
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: VideoNote
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: VoiceNote
          from: fileId
          upgrader: "org.yotsuba.database.initializers.V169Initializers.FileUid"
          type: MTFileUid
      - upgradeData:
          transformClass: InlineKeyboardButtonTypeLoginUrl
          from: url
          upgrader: "org.yotsuba.database.initializers.V169Initializers.LegacyURL"
          type: String
      - upgradeData:
          transformClass: InlineKeyboardButtonTypeUrl
          from: url
          upgrader: "org.yotsuba.database.initializers.V169Initializers.LegacyURL"
          type: String
  0.0.3:
    previousVersion: 0.0.2
    details:
      changelog: "52bit user ids"
    transformations:
      - upgradeData:
          transformClass: User
          from: haveAccessBots
          upgrader: "org.yotsuba.database.initializers.V003.LegacyUserIdSetUpgrader"
          type: OldUserIdSetV2
      - upgradeData:
          transformClass: SuperCollectionId
          from: tableId
          upgrader: "org.yotsuba.database.initializers.V003.SuperCollectionIdUpgrader"
          type: Int52
      - upgradeData:
          transformClass: BasicGroupId
          from: tableId
          upgrader: "org.yotsuba.database.initializers.V003.BasicGroupIdUpgrader"
          type: Int52
      - upgradeData:
          transformClass: UserId
          from: tableId
          upgrader: "org.yotsuba.database.initializers.V003.UserIdUpgrader"
          type: Int52
      - upgradeData:
          transformClass: DeprecatedId
          from: tableId
          upgrader: "org.yotsuba.database.initializers.V003.DeprecatedIdUpgrader"
          type: Int52
      - upgradeData:
          transformClass: MessageChatAddMembers
          from: memberUserIds
          upgrader: "org.yotsuba.database.initializers.V003.MessageChatAddMembersUpgrader"
          type: OldUserIdSetV2
      - upgradeData:
          transformClass: MessageChatDeleteMember
          from: userId
          upgrader: "org.yotsuba.database.initializers.V003.MessageChatDeleteMemberUpgrader"
          type: UserId
      - upgradeData:
          transformClass: ChatReceivers
          from: receivers
          upgrader: "org.yotsuba.database.initializers.V003.ChatReceiversUpgrader"
          type: OldUserIdSetV2
      - upgradeData:
          transformClass: Contact
          from: userId
          upgrader: "org.yotsuba.database.initializers.V003.ContactUserIdUpgrader"
          type: UserId
  0.0.4:
    previousVersion: 0.0.3
    details:
      changelog: "Full Webpage data"
    transformations:
      - upgradeData:
          transformClass: User
          from: haveAccessBots
          upgrader: "org.yotsuba.database.initializers.V004.LegacyUserIdSetUpgrader"
          type: UserIdSet
      - upgradeData:
